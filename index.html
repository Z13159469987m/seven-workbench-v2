<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="workbench-deployment" content="github-pages-v2">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>七秒の魔法工作台 🌸</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="魔法工作台">
<meta name="theme-color" content="#ff8fc4">
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="assets/icon-192.png?v=bf4cb6c24303" type="image/png">
<link rel="icon" href="assets/icon-512.png?v=5bd807f9b6a9" type="image/png" sizes="512x512">
<link rel="shortcut icon" href="assets/icon-192.png?v=bf4cb6c24303" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png?v=8f36ed55bb1a">
<link rel="apple-touch-icon" href="assets/icon-180.png?v=8f36ed55bb1a">
<style>
:root{
  --pink:#ff8fc4; --pink-deep:#ff5fa2; --pink-soft:#ffe3f1; --pink-pale:#fff0f7;
  --cream:#fff7fb; --ink:#5b3a4f; --ink2:#9c7c8e; --line:#ffd9ec;
  --gold:#ffcf5c; --mint:#9be3c9; --sky:#a9d5ff;
  --radius:20px; --radius-s:14px;
  --shadow:0 8px 26px rgba(255,140,196,.18);
  --shadow-s:0 3px 12px rgba(255,140,196,.14);
  --font:"PingFang SC","Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:
  radial-gradient(1200px 600px at 10% -10%, #ffe0f0 0%, transparent 60%),
  radial-gradient(1000px 500px at 110% 10%, #ffeede 0%, transparent 55%),
  linear-gradient(180deg,#fff6fb 0%,#fdeef8 100%);
  background-attachment:fixed;min-height:100vh;line-height:1.6}

.floaty{position:fixed;pointer-events:none;font-size:22px;opacity:.45;z-index:0;animation:floaty 9s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(12deg)}}
@keyframes eggWobble{0%,60%{transform:rotate(0deg)}72%{transform:rotate(6deg)}82%{transform:rotate(-5deg)}92%{transform:rotate(3deg)}100%{transform:rotate(0deg)}}

.app{display:flex;min-height:100vh;position:relative;z-index:1}

/* 侧边栏 */
.sidebar{width:260px;flex:0 0 auto;padding:18px 14px 14px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
  border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:relative}
.brand{text-align:center;padding:10px 4px 14px}
.sakura-avatar{width:156px;height:156px;margin:0 auto 10px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink-pale),#fff);border:3px solid #fff;box-shadow:var(--shadow-s);display:grid;place-items:center;overflow:hidden}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.5px}
.brand p{font-size:11px;color:var(--ink2);margin-top:3px}
.nav-item{border:none;cursor:pointer;text-align:left;padding:11px 13px;border-radius:14px;
  font-size:14px;font-weight:600;color:var(--ink);background:transparent;display:flex;align-items:center;gap:10px;
  transition:.16s;font-family:var(--font)}
.nav-item .ic{font-size:18px;width:24px;text-align:center}
.nav-item:hover{background:var(--pink-pale)}
.nav-item.active{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;box-shadow:var(--shadow-s)}
.nav-spacer{flex:1}
.nav-foot{font-size:11px;color:var(--ink2);padding:10px 6px;text-align:center;line-height:1.7}
.sakura-avatar img{width:100%;height:100%;object-fit:contain;transform:rotate(-36deg);display:block}

/* 内容区 */
.content{flex:1;min-width:0;padding:22px 26px 30px;max-width:1100px;margin:0 auto;position:relative;padding-top:80px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h2{font-size:21px;font-weight:800}
.topbar .hint{font-size:12.5px;color:var(--ink2)}
.page-mascot{position:absolute;top:8px;right:14px;width:236px;height:260px;opacity:.45;pointer-events:none;z-index:0;transition:.35s;transform:rotate(-36deg);transform-origin:center center}
.page-mascot img{width:100%;height:100%;object-fit:contain;animation:eggWobble 5.5s ease-in-out infinite;transform-origin:center;filter:drop-shadow(0 4px 14px rgba(255,140,196,.18))}
@media(max-width:760px){.page-mascot{width:88px;height:100px;top:50px;opacity:.4}}
@media(min-width:761px){.content{padding-right:230px}}
#view{position:relative;z-index:1}
.hc-title{cursor:pointer;color:inherit;text-decoration:none}
.hc-title:hover{text-decoration:underline}

/* 每日励志语录横框 */
.daily-quote{background:linear-gradient(135deg,var(--pink-soft),#fff0f7);border:1px dashed var(--pink);border-radius:var(--radius-s);padding:11px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13.5px;line-height:1.6;color:var(--pink-deep);font-weight:600;position:relative}
.daily-quote .dq-pin{cursor:pointer;font-size:15px;user-select:none;flex-shrink:0}
.daily-quote .dq-text{flex:1}
.daily-quote .dq-close{cursor:pointer;background:none;border:none;font-size:16px;color:var(--ink2);padding:0 4px;line-height:1;flex-shrink:0}
.daily-quote.hidden{display:none}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.panel-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-title h3{font-size:17px;font-weight:800}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--ink);transition:.15s;font-family:var(--font)}
.btn:hover{border-color:var(--pink);color:var(--pink-deep);background:var(--pink-pale)}
.btn.primary{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;border:none;box-shadow:var(--shadow-s)}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.sm.ai{background:#eef4ff;border-color:#cfe0ff;color:#2a5bd7}
.btn.sm.ai:hover{background:#e2edff}
.pc-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
select,input[type=text],input[type=number],input[type=url],textarea{font-family:var(--font);font-size:14px;color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--pink)}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--pink-soft);color:var(--pink-deep);font-weight:600}
.tag.mint{background:#e2f7ef;color:#1f9d6b}
.tag.sky{background:#e6f1ff;color:#2f7fd6}
.empty{color:var(--ink2);text-align:center;padding:40px 0;font-size:14px}

/* ===== 资讯区 ===== */
.report-select{margin-bottom:16px}
.quad-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.quad{position:relative;border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;
  background:linear-gradient(135deg,#fff,#fff4fa);overflow:hidden;transition:.16s;min-height:110px}
.quad:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.quad .bg{position:absolute;right:-6px;bottom:-10px;font-size:60px;opacity:.12}
.quad h4{font-size:15px;font-weight:800;margin-bottom:5px}
.quad .cnt{font-size:12px;color:var(--ink2)}
.banner5{margin-top:14px;border:1px dashed var(--pink);border-radius:var(--radius);padding:14px 16px;
  background:linear-gradient(135deg,#fff,#fff0f7);display:flex;align-items:center;gap:14px;cursor:pointer}
.banner5 .ic{font-size:30px}
.banner5 h4{font-size:15px;font-weight:800}
.banner5 p{font-size:12px;color:var(--ink2)}

.section-list .sec-head{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.section-list .sec-head .num{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;font-weight:800;font-size:14px}
.item{border:1px solid var(--line);border-radius:var(--radius-s);padding:13px 15px;margin-bottom:11px;background:#fff;transition:.15s;position:relative}
.item.hl{background:#fff7d6;border-color:#ffe08a}
.item-top{display:flex;align-items:flex-start;gap:10px}
.item-title{font-size:15px;font-weight:700;line-height:1.45;flex:1}
.item-title a{color:var(--ink);text-decoration:none;border-bottom:1px dashed #e3b9cf}
.item-title a:hover{color:var(--pink-deep)}
.item-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.ibtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink2);transition:.12s;font-family:var(--font)}
.ibtn:hover{border-color:var(--pink);color:var(--pink-deep)}
.ibtn.on-hl{background:#fff3c4;border-color:#f0c400;color:#8a6a00}
.ibtn.on-fav{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-deep)}
.item .src{font-size:12px;color:var(--ink2);margin-top:5px}
.item .summary{font-size:13.5px;line-height:1.75;margin-top:8px;color:#6b4a5c}
.item .impact{font-size:13.5px;line-height:1.75;margin-top:8px;background:var(--pink-pale);border-radius:12px;padding:9px 13px;color:#a23c74}
.item-foot{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* 炫彩屋 · 可编辑工作流程轴 */
.flow-node{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.flow-idx{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px}
.flow-body{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.flow-title{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700;font-family:var(--font);color:var(--ink)}
.flow-content{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;min-height:46px;resize:vertical;font-family:var(--font);color:var(--ink);line-height:1.6}
.flow-del{border:none;background:none;color:#c98aaa;cursor:pointer;font-size:15px;flex-shrink:0;line-height:1}
.flow-del:hover{color:#e0558c}
.flow-add{margin-top:4px}
.item.hl .impact{background:rgba(255,255,255,.6)}
/* 局部文字高亮（长按 / 选中正文里的句子） */
.hl-target{cursor:text;user-select:text;-webkit-user-select:text}
.user-hl{background:#fff36b;color:inherit;border-radius:3px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:pointer}
.user-hl:hover{background:#ffe23d}
.hl-hint{font-size:11.5px;color:#b89;margin-top:9px;display:flex;align-items:center;gap:4px;user-select:none}
#hlToolbar{position:fixed;z-index:9999;display:none;align-items:center;gap:6px;background:#2b2330;color:#fff;border-radius:10px;padding:6px 8px;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translateX(-50%)}
#hlToolbar button{background:#ffd23d;border:none;color:#3a2b00;font-weight:700;border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer}
#hlToolbar .hl-x{background:transparent;color:#fff;font-size:12px;padding:4px 6px}
.favbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.favbar .pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink2)}
.favbar .pill.active{background:var(--pink);color:#fff;border-color:var(--pink)}

/* ===== 洛克炫彩屋（重构版：tab 切换） ===== */
.rock-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.rock-tab{padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;border-radius:12px 12px 0 0;border:1px solid transparent;border-bottom:none;background:transparent;font-family:var(--font);transition:.12s}
.rock-tab:hover{color:var(--pink-deep);background:var(--pink-pale)}
.rock-tab.active{color:var(--pink-deep);background:#fff;border-color:var(--line);border-bottom:1px solid #fff;margin-bottom:-1px;font-weight:800}

.week-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.week-head h2{font-size:17px;font-weight:800}
.week-range{font-size:12px;color:var(--ink2)}
.rock-layout{display:flex;flex-direction:column;gap:16px}
.rock-top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.rock-progress{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#fff7fb,#ffe8f3);border:1px solid var(--pink-soft);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;box-shadow:var(--shadow-s)}
.rock-progress .pbar-inline{height:10px;width:110px;border-radius:5px;background:#ffe1ee;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.rock-progress .pbar-inline>div{height:100%;background:linear-gradient(90deg,var(--mint),#46c98a);border-radius:5px;transition:width .5s;box-shadow:0 1px 3px rgba(70,201,138,.3)}
.rock-progress .progress-egg{width:24px;height:24px;display:inline-block;vertical-align:middle;margin-left:2px}
.rock-progress .progress-egg img{width:100%;height:100%;object-fit:contain;animation:eggWobble 5.5s ease-in-out infinite}

/* 7天横向滚动打卡（方案A） */
.days-scroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 2px 10px;scrollbar-width:none}
.days-scroll::-webkit-scrollbar{display:none}
.day-h{flex:0 0 auto;width:172px;border:1px solid var(--line);border-radius:14px;padding:12px 10px 10px;background:#fff;text-align:center;scroll-snap-align:start;transition:.15s;position:relative}
.day-h.today{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-pale),var(--shadow-s);background:linear-gradient(180deg,#fff,#fff7fb)}
.day-h.future{opacity:.45}
.day-h.done{border-color:#b6ebd2;background:linear-gradient(180deg,#f6fcf9,#fff)}
.day-h h4{font-size:13px;font-weight:800;margin-bottom:2px;color:var(--ink)}
.day-h.today h4{color:var(--pink-deep)}
.day-h h4 .tag{font-size:9px;background:var(--pink-deep);color:#fff;border-radius:5px;padding:1px 5px;font-weight:700;vertical-align:middle;margin-left:3px}
.day-h .day-date{font-size:10.5px;color:var(--ink2);margin-bottom:6px}
.day-h .day-dot{width:16px;height:16px;border-radius:50%;margin:0 auto 6px;border:2px solid #d9b6c8;background:#fff;transition:.2s}
.day-h.done .day-dot{background:linear-gradient(135deg,var(--mint),#46c98a);border-color:var(--mint);box-shadow:0 0 8px rgba(70,201,138,.4)}
.day-h .day-status{font-size:11px;color:var(--ink2);line-height:1.3;min-height:18px;margin-bottom:6px;font-weight:600}
.day-h.done .day-status{color:var(--mint);font-weight:700}
.day-h .check-mini{display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);cursor:pointer;font-size:12px;transition:.12s;user-select:none;background:var(--pink-pale);white-space:nowrap;color:var(--ink2);font-weight:600;margin-bottom:6px}
.day-h .check-mini:hover{border-color:var(--pink-deep);background:var(--pink-soft);color:var(--pink-deep)}
.day-h.done .check-mini{background:#e7f9f0;border-color:#b6ebd2;color:#1f9d6b;font-weight:700}
.day-h.future .check-mini{pointer-events:none}

/* 子任务（横向卡片内展开） */
.day-h .subtasks{margin-top:2px;text-align:left;border-top:1px dashed var(--line);padding-top:7px}
.day-h .subtask-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink2);font-weight:600;margin-bottom:5px;cursor:pointer;user-select:none}
.day-h .subtask-head:hover{color:var(--pink-deep)}
.day-h .subtask-arrow{font-size:10px;transition:.2s}
.day-h .subtask-list{display:flex;flex-direction:column;gap:3px}
.day-h .subtask-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink);padding:2px 4px;border-radius:6px;transition:.1s}
.day-h .subtask-item:hover{background:var(--pink-pale)}
.day-h .subtask-cb{width:16px;height:16px;border-radius:4px;border:2px solid #d9b6c8;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:#fff;background:#fff;transition:.12s}
.day-h .subtask-cb.done{background:var(--mint);border-color:var(--mint)}
.day-h .subtask-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.day-h .subtask-text.done{text-decoration:line-through;color:var(--ink2)}
.day-h .subtask-del{width:16px;height:16px;border-radius:3px;border:none;background:none;color:#c98aaa;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:.12s}
.day-h .subtask-item:hover .subtask-del{opacity:1}
.day-h .subtask-add{display:flex;align-items:center;gap:3px;margin-top:5px;font-size:11px;color:var(--ink2);cursor:pointer;padding:3px 5px;border-radius:6px;border:1px dashed var(--line);font-weight:600}
.day-h .subtask-add:hover{color:var(--pink-deep);border-color:var(--pink);background:var(--pink-pale)}
.day-h .subtask-add input{border:none;background:transparent;font-size:11px;font-family:var(--font);color:var(--ink);flex:1;outline:none;min-width:0;width:100%}
.day-h .subtask-add input::placeholder{color:var(--ink2);font-size:10.5px}

.flower-card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#eafaf3 0%,#fff4fa 100%);padding:18px 14px;text-align:center;box-shadow:var(--shadow-s)}
.flower-card h3{font-size:14px;margin-bottom:3px;font-weight:800;color:var(--ink)}
.flower-card .stage-name{font-size:12px;color:#1f9d6b;font-weight:700;margin-top:6px}
.flower-card .flower-wrap{display:flex;justify-content:center;margin:6px 0}
.grove{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
.grove-item{border:1px solid var(--line);border-radius:var(--radius-s);padding:12px;text-align:center;background:linear-gradient(180deg,#f3fbf7,#fff4fa);cursor:pointer;transition:.15s}
.grove-item:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.grove-item .wk{font-size:12px;color:var(--ink2);margin-top:5px}
.grove-item .cnt{font-size:11px;color:#1f9d6b;font-weight:700}
.nursery{margin-top:14px}
.nursery-title{font-size:13px;font-weight:800;color:var(--pink-deep);margin:12px 0 6px;padding-left:4px}
.nursery-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.nursery-bed{position:relative;margin:0 auto;border-radius:18px;background:linear-gradient(180deg,#eafaf0,#cdeedb);border:1px solid #bfe3cf;box-shadow:inset 0 2px 10px rgba(80,160,110,.15)}
.nursery-bed.past{background:linear-gradient(180deg,#f3eefa,#e3d8f3);border-color:#e0d2f0}
.flower-item{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:transform .15s}
.flower-item:hover{transform:translate(-50%,-50%) scale(1.18)}
.flower-item.cur{filter:drop-shadow(0 0 5px #ff8fb3)}
.cur-tag{position:absolute;left:50%;top:-11px;transform:translateX(-50%);font-size:9px;background:#ff6fae;color:#fff;padding:1px 5px;border-radius:8px;white-space:nowrap}
.back-link{display:inline-block;margin-bottom:12px;font-size:13px;color:var(--pink-deep);cursor:pointer;background:none;border:none;font-weight:700;font-family:var(--font)}

/* 周计划卡片 */
.plan-card{border:2px dashed var(--gold);border-radius:var(--radius);padding:14px 16px;background:linear-gradient(135deg,#fffef5,#fff9e6);margin-bottom:14px;box-shadow:var(--shadow-s)}
.plan-card h4{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;color:#8a6a00}
.plan-input{width:100%;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-family:var(--font);background:#fff}

/* 日志弹窗样式 */
.log-entry{border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;margin-bottom:8px;background:#fff}
.log-entry .log-time{font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:4px}
.log-entry .log-body{font-size:13.5px;line-height:1.7;color:var(--ink)}

/* 工作流程轴（时间轴） */
.timeline-section{margin-top:18px}
.timeline-section h3{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:3px;background:var(--line);border-radius:2px}
.tl-node{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-23px;top:4px;width:18px;height:18px;border-radius:50%;border:3px solid var(--mint);background:#fff;z-index:1;display:grid;place-items:center;font-size:10px}
.tl-dot.done{background:var(--mint);color:#fff}
.tl-dot.partial{background:var(--gold);color:#fff}
.tl-content{background:#fff;border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 14px}
.tl-date{font-size:12px;font-weight:800;color:var(--pink-deep);margin-bottom:4px}
.tl-log{font-size:13px;line-height:1.6;color:var(--ink)}

/* ===== 实验田（标签页） ===== */
.lab-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.lab-tab{padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;border-radius:12px 12px 0 0;border:1px solid transparent;border-bottom:none;background:transparent}
.lab-tab.active{color:var(--pink-deep);background:#fff;border-color:var(--line);border-bottom:1px solid #fff;margin-bottom:-1px}
.lab-week-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lab-title-input{font-size:15px;font-weight:700;border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:200px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:30px 1fr 70px 28px auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;background:#fff}
@media(max-width:560px){.step{grid-template-columns:26px 1fr 60px 26px auto;gap:6px}}
.step .idx{width:26px;height:26px;border-radius:8px;background:var(--pink-soft);color:var(--pink-deep);display:grid;place-items:center;font-weight:800;flex-shrink:0;font-size:13px}
.step .sname{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .sname[contenteditable]{outline:none;border-bottom:1px dashed var(--line);white-space:normal}
.step.done{border-color:var(--mint);background:#f1fbf6}
.step .hours{width:100%}
.step .done-box{width:22px;height:22px;border-radius:8px;border:2px solid #d9b6c8;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer;flex-shrink:0;background:#fff}
.step.done .done-box{background:var(--mint);border-color:var(--mint)}
.bottle-wrap{text-align:center;background:linear-gradient(180deg,#fff,#fef0f8);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.bottle-pct{font-size:12px;color:var(--ink2);margin-top:5px}
.bottle-stage{font-size:12px;color:var(--pink-deep);font-weight:700;margin-top:3px}
.ops-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:6px}
.ops-cell{border:1px solid var(--line);border-radius:var(--radius-s);padding:10px;background:var(--pink-pale)}
.ops-cell label{font-size:11px;color:var(--ink2);display:block;margin-bottom:4px}
.ops-cell input{width:100%;font-size:13px;padding:7px 9px}
.analysis .row{border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;margin-bottom:10px;background:#fff}
.analysis .row h4{font-size:14px;font-weight:800;margin-bottom:5px;display:flex;gap:8px;align-items:center}
.analysis .row p{font-size:13px;line-height:1.7;color:#6b4a5c}
.analysis .row .kpi{font-size:20px;font-weight:800;color:var(--pink-deep)}
.analysis .row .sub{font-size:12px;color:var(--ink2)}

/* ===== 热度选题 ===== */

.hot-tab{padding:6px 14px;font-size:12.5px;font-weight:700;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2);font-family:var(--font);transition:.12s}
.hot-tab.active{background:linear-gradient(135deg,#ff6b35,#ff4500);color:#fff;border-color:#ff4500}

.hot-filter.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.hot-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:#fff;margin-bottom:12px;transition:.15s}
.hot-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hot-card .hc-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.hot-card .hc-fire{font-size:20px;flex-shrink:0}
.hot-card .hc-title{font-size:15px;font-weight:800;line-height:1.45;flex:1}
.hot-card .hc-tag{font-size:10px}

.hot-card .hc-example{font-size:12.5px;line-height:1.6;color:var(--ink2);background:#f8f0fa;border-radius:10px;padding:8px 12px;margin-bottom:8px;border-left:3px solid var(--gold)}
.hot-card .hc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.hot-card .hc-save-btn{margin-top:8px}

/* ===== 收藏整理 ===== */
.add-link-card{border:2px dashed var(--pink);border-radius:var(--radius);padding:16px;background:linear-gradient(135deg,#fff,#fff4fa);margin-bottom:18px}

.modal-label{font-size:12px;color:var(--ink2);font-weight:600;display:block;margin-bottom:4px}

.cat-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cat-quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:var(--font);color:var(--ink2)}
.cat-quick button:hover{border-color:var(--pink);color:var(--pink-deep)}

/* 分类选择弹窗内部样式 */
.cat-picker-list{max-height:200px;overflow-y:auto;margin-bottom:10px}
.cat-picker-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);transition:.12s;border:1px solid transparent}

.add-potion-card h4{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}

@media(max-width:760px){.potion-form{grid-template-columns:1fr}}

.add-potion-card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.potion-card .pc-head h4{font-size:16px;font-weight:800;flex:1;min-width:0}
.potion-card .pc-content{font-size:13.5px;line-height:1.7;color:#6b4a5c;background:var(--pink-pale);border-radius:12px;padding:10px 13px;margin-bottom:12px;white-space:pre-wrap}

/* 手机/平板竖屏：上下排列，单个框更宽更好读（断点由 680px 提到 860px） */

.pc-area{width:100%;min-height:220px;resize:vertical;font-size:14.5px;line-height:1.8;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:var(--font);color:var(--ink);background:#fff}

.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;cursor:pointer;font-size:12px;color:var(--ink2)}
.mini:hover{color:var(--pink-deep);border-color:var(--pink)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:99}

  opacity:0;z-index:100;transition:.25s;text-align:center;pointer-events:none}

<script>
/* ============ 数据层 ============ */
const $=s=>document.querySelector(s);
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v)); if(window.__sync)window.__sync.markDirty(k);}
};
const REPORTS=(window.WORKBENCH_REPORTS||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).filter((r,i,a)=>i===0||a[i-1].date!==r.date); // 同日去重，保留最新一份
function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escapeAttr(s){return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let marks=store.get('wb_marks',{});
let weeks=store.get('wb_weeks',{});
let lab=store.get('wb_lab',{weeks:{}});
if(!lab.weeks)lab.weeks={};
/* P3A：旧收藏只读保留；进入收藏小屋时幂等导入V2，不再向旧键合并种子。 */
let favGroups=store.get('wb_favgroups',[]);
let collapsedGroups={};
let potions=store.get('wb_potions',[]);
let hotFavs=store.get('wb_hot_favs',[]); /* 实验田·选题收藏夹：热度选题存为灵感独立存放，不进进阶魔药 */
let potionOverrides=store.get('wb_potion_overrides',{});
// 魔药：potions.js 中已有生成结果、但灵感列表(wb_potions)尚未记录的 id，自动补建卡片以便显示（外部施法结果兜底）
function syncPotionResults(){
  const pres=window.POTION_RESULTS||{};
  let changed=false;
  for(const id in pres){
    const r=pres[id]||{};
    if((r.search||r.extend) && !potions.some(p=>p.id===id)){
      potions.push({id:id, title:'(待命名) '+id, content:'此灵感由外部施法结果填充，可点「编辑」补充标题与内容。', cat:'', created:'(外部)'});
      changed=true;
    }
  }
  if(changed) store.set('wb_potions',potions);
}
syncPotionResults();
let curTab='news';

/* 新增 localStorage keys */
let rockLogs=store.get('wb_rock_logs',{});       // 按日期索引的日志

let aiSettings=store.get('wb_ai_settings',{provider:'deepseek',apiKey:'',model:'',baseUrl:''});
function stripHtml(h){const d=document.createElement('div');d.innerHTML=h;return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim();}
async function callAI(system,user,ov){
  const s=ov||aiSettings;
  if(!s.apiKey) throw new Error('NO_KEY');
  const base=(s.baseUrl||(s.provider==='moonshot'?'https://api.moonshot.cn/v1':'https://api.deepseek.com')).replace(/\/$/,'');
  const model=s.model||(s.provider==='moonshot'?'kimi-k3':'deepseek-chat');
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),90000);
  try{
    const r=await fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model,messages:[{role:'system',content:system},{role:'user',content:user}],stream:false}),signal:ctrl.signal});
    if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' '+t.slice(0,240));}
    const j=await r.json();
    return (j.choices&&j.choices[0]&&j.choices[0].message.content)||'';
  }finally{clearTimeout(timer);}
}
async function aiSummarize(){
  const url=$('#newUrl').value.trim();
  if(!url){showInfoModal('先粘贴链接','请先在「链接地址」填写要生成摘要的网址。');return;}
  const btn=document.getElementById('aiSumBtn');const old=btn.textContent;btn.disabled=true;btn.textContent='🤖 生成中…';
  try{
    let body=$('#newContent')?$('#newContent').value.trim():'';
    if(!body){ try{ const res=await fetch(url,{mode:'cors'}); if(res.ok){const txt=await res.text();body=stripHtml(txt).slice(0,6000);} }catch(e){} }
    const sys='你是一个内容摘要助手，服务于做 AI 漫剧 / 番茄推文 / 洛克精灵方向创作的人的收藏小屋。用简洁大白话。';
    const user= body
      ? ('请基于下面内容生成收藏摘要：\n链接：'+url+'\n\n正文：\n'+body+'\n\n要求：\n- 2~3 句总结核心要点\n- 点出对「AI漫剧/番茄推文/洛克精灵」方向的启发或可用角度\n- 若是视频/账号描述大概内容')
      : ('我拿不到该链接正文（可能需登录或反爬）。链接：'+url+'\n请基于链接主题与你的知识给出：\n- 为什么值得收藏（判断依据）\n- 可能的要点方向 2~3 条\n- 对 AI 漫剧/番茄推文/洛克精灵方向的启发');
    const sum=await callAI(sys,user);
    $('#newSummary').value=sum.trim();
    if(typeof miniCheer==='function') miniCheer('🤖 摘要已生成'); else showInfoModal('摘要已生成','已填入「AI摘要」框，可直接保存。');
  }catch(err){
    if(err.message==='NO_KEY'){ showInfoModal('还没配置 AI','要使用「AI 自动摘要」，请先配置 Key。<br><button class="btn primary" onclick="openAiSettings()" style="margin-top:10px">⚙️ 去配置</button><br><br><span class="modal-hint">Key 只存本机浏览器，不上传任何服务器。</span>'); }
    else showInfoModal('生成失败','无法生成摘要：'+err.message+'\n\n可改用「✨ 一键复制指令」交给我处理，或检查网络/Key。');
  }finally{btn.disabled=false;btn.textContent=old;}
}

function dailySeed(){
  const d=new Date();
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function getDailyQuote(tab){
  const quotes=DAILY_QUOTES[tab]||DAILY_QUOTES.news;
  const seed=dailySeed();
  const idx=seed%quotes.length;
  return quotes[idx];
}
function isQuoteHidden(tab){
  const h=hiddenQuotes[tab];
  return h&&h===iso(new Date());
}
function hideQuote(tab){
  hiddenQuotes[tab]=iso(new Date());
  store.set('wb_hidden_quotes',hiddenQuotes);
  renderDailyQuote();
}
function renderDailyQuote(){
  const el=$('#dailyQuote');
  if(!el)return;
  if(isQuoteHidden(curTab)){el.classList.add('hidden');return;}
  el.classList.remove('hidden');
  const quote=getDailyQuote(curTab);
  el.innerHTML=`<span class="dq-pin" onclick="toggleQuotePin()" title="收起/展开">📌</span><span class="dq-text">${escapeHtml(quote)}</span><span class="dq-close" onclick="hideQuote('${curTab}')" title="今天不再显示">×</span>`;
}
let quotePinned=true;
function toggleQuotePin(){quotePinned=!quotePinned;renderDailyQuote();if(!quotePinned)hideQuote(curTab);}

function showCategoryPickerModal(title,currentCat,existingCats,onSelect){
  let html=`<h4>${title}</h4><div class="cat-picker-list">`;
  existingCats.forEach(c=>{
    const sel=c===currentCat?'selected':'';
    html+=`<div class="cat-picker-item ${sel}" data-cat="${escapeAttr(c)}"><span style="font-size:16px">${sel?'✓':'○'}</span> ${escapeHtml(c)}</div>`;
  });
  html+=`</div>`;
  html+=`<div class="field"><label class="modal-label">或新建分类：</label><input id="newCatInput" placeholder="输入新分类名称..."></div>`;
  html+=`<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" id="catPickOk">确定</button></div>`;
  $('#modalBox').innerHTML=html;
  $('#modal').classList.add('show');
  let selected=currentCat;
  $('#modalBox').querySelectorAll('.cat-picker-item').forEach(el=>{
    el.onclick=()=>{
      selected=el.dataset.cat;
      $('#modalBox').querySelectorAll('.cat-picker-item').forEach(e=>{
        e.classList.toggle('selected',e.dataset.cat===selected);
        e.querySelector('span').textContent=e.dataset.cat===selected?'✓':'○';
      });
      $('#newCatInput').value='';
    };
  });
  $('#catPickOk').onclick=()=>{
    const newCat=$('#newCatInput').value.trim();
    const finalVal=newCat||selected;
    closeModal();
    onSelect(finalVal);
  };
  setTimeout(()=>{$('#newCatInput').focus();},30);
}

// ===== 局部文字高亮：选中正文片段 → 浮动工具条 → 存入 marks[id].highlights =====
function initHighlight(){
  const tb=document.createElement('div');
  tb.id='hlToolbar';
  tb.innerHTML='<button id="hlAdd">🖍 高亮</button><button class="hl-x" id="hlCancel">✕</button>';
  document.body.appendChild(tb);
  let hlState=null;       // {text,id} 选中后保存，点击按钮时即使选区被清也能高亮
  let applying=false;     // 正在执行高亮/取消，跳过 selectionchange 的误隐藏
  function hideHl(){ tb.style.display='none'; }
  window._hlHideToolbar=hideHl;
  function showHl(text,id,rect){
    hlState={text,id};
    let left=rect.left+rect.width/2;
    let top=rect.bottom+8;
    left=Math.max(70,Math.min(left,window.innerWidth-70));   // 防溢出屏幕两侧
    if(top>window.innerHeight-60) top=rect.top-46;            // 太靠底就翻到上方
    tb.style.left=left+'px';
    tb.style.top=top+'px';
    tb.style.display='flex';
  }
  // 根据当前选区决定工具条显隐（桌面/移动端统一入口）
  function evalSelection(){
    if(applying) return;
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed||!sel.toString().trim()){ if(tb.style.display!=='none') hideHl(); return; }
    let range=null; try{ range=sel.getRangeAt(0); }catch(e){ hideHl(); return; }
    const node=range.commonAncestorContainer;
    const el=node&&node.nodeType===3?node.parentElement:node;
    const target=el&&el.closest?el.closest('.hl-target'):null;
    const itemEl=target&&target.closest('.item');
    if(!itemEl){ if(tb.style.display!=='none') hideHl(); return; }
    const text=sel.toString().trim();
    if(!text){ hideHl(); return; }
    showHl(text,itemEl.dataset.id,range.getBoundingClientRect());
  }
  // 主触发：selectionchange 在桌面和移动端（含长按选择）都可靠触发，用防抖稳定
  let deb=null;
  document.addEventListener('selectionchange',()=>{ clearTimeout(deb); deb=setTimeout(evalSelection,60); });
  document.addEventListener('scroll',hideHl,true);
  // 点击/触工具条之外才收起
  document.addEventListener('mousedown',(e)=>{ if(tb.style.display!=='none'&&!tb.contains(e.target)) hideHl(); });
  document.addEventListener('touchstart',(e)=>{ if(tb.style.display!=='none'&&!tb.contains(e.target)) hideHl(); },{passive:true});
  function doAdd(){
    if(!hlState) return;
    applying=true;
    const {text,id}=hlState;
    marks[id]=marks[id]||{};
    marks[id].highlights=marks[id].highlights||[];
    if(text&&!marks[id].highlights.includes(text)) marks[id].highlights.push(text);
    store.set('wb_marks',marks);
    try{ window.getSelection().removeAllRanges(); }catch(e){}
    applying=false; hideHl(); renderNews();
  }
  function doCancel(){ applying=true; hideHl(); applying=false; hlState=null; }
  // 按钮：桌面用 click；移动端用 touchend+preventDefault（阻止浏览器清选区/吞 click），双触发去重
  function bindBtn(btn,handler){
    let last=0;
    btn.addEventListener('click',(e)=>{ e.preventDefault(); handler(); });
    btn.addEventListener('touchend',(e)=>{ e.preventDefault(); const now=Date.now(); if(now-last<500) return; last=now; handler(); });
  }
  bindBtn(tb.querySelector('#hlAdd'),doAdd);
  bindBtn(tb.querySelector('#hlCancel'),doCancel);
  // 点击已高亮处 → 取消该句高亮
  const view=$('#view');
  view.addEventListener('click',(e)=>{
    const mk=e.target.closest('.user-hl');
    if(mk){
      const itemEl=mk.closest('.item');
      const id=itemEl&&itemEl.dataset.id;
      const txt=mk.textContent;
      if(id&&marks[id]&&marks[id].highlights){
        marks[id].highlights=marks[id].highlights.filter(h=>h!==txt);
        store.set('wb_marks',marks);
        renderNews();
      }
    }
  });
}
// 把 highlights 中的子串在文本里重新描黄（用于日报列表与收藏夹两边一致显示）
function applyHighlights(text, highlights){
  if(text==null) return '';
  let html=escapeHtml(text);
  const seen=new Set();
  for(const h of (highlights||[])){
    if(!h||seen.has(h)) continue;
    seen.add(h);
    const he=escapeHtml(h);
    if(!he) continue;
    const re=new RegExp('('+he.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','g');
    html=html.replace(re,'<mark class="user-hl" title="点击取消高亮">$1</mark>');
  }
  return html;
}

/* ============ 洛克炫彩屋（重构：周计划 + 打卡 + 日志 + 时间轴） ============ */
const DAY_NAMES=['周一','周二','周三','周四','周五','周六','周日'];
function mondayOf(d){const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);x.setHours(0,0,0,0);return x;}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekDoneCount(w){let n=0;for(let i=0;i<7;i++){const d=w['d'+i]||{};if(d.done)n++;}return n;}
/* 树木生长图已移除：周成长统一用 flowerSVG（花）表现，与「我的苗圃」一致 */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const FLOWER_COLORS=['#ff8fb3','#ff6fae','#ff9ec4','#e88fd0','#ffb3c8','#ff7eb6','#ffd27f','#c9a0ff'];
function flowerColor(key){return FLOWER_COLORS[hashStr(key)%FLOWER_COLORS.length];}
function flowerStage(n){if(n<=0)return{open:0,label:'种子入土',emoji:'🌰'};if(n<=2)return{open:0.28,label:'花苞初绽',emoji:'🌱'};if(n<=4)return{open:0.55,label:'半开',emoji:'🌸'};if(n<=6)return{open:0.82,label:'将开',emoji:'🌺'};return{open:1,label:'满开',emoji:'🌺'};}
function svgWrap(w,h,inner){return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+inner+'</svg>';}
function flowerSVG(n,size,key){
  const col=flowerColor(key||'x'),st=flowerStage(n),open=st.open,w=size,h=size,cx=w/2,gy=h-5;
  let s='<ellipse cx="'+cx+'" cy="'+(gy+2)+'" rx="'+(w*0.32)+'" ry="4" fill="#cdeccd"/>';
  if(n<=0){s+='<ellipse cx="'+cx+'" cy="'+(gy-2)+'" rx="4" ry="3" fill="#8a6842"/>';return svgWrap(w,h,s);}
  const stemH=6+open*(h*0.5);
  s+='<rect x="'+(cx-1.5)+'" y="'+(gy-stemH)+'" width="3" height="'+stemH+'" rx="1.5" fill="#5fb878"/>';
  const ly=gy-stemH*0.45;
  s+='<ellipse cx="'+(cx-7)+'" cy="'+ly+'" rx="6" ry="3" fill="#7fd6a0" transform="rotate(-30 '+(cx-7)+' '+ly+')"/>';
  s+='<ellipse cx="'+(cx+7)+'" cy="'+ly+4+'" rx="6" ry="3" fill="#62c79a" transform="rotate(30 '+(cx+7)+' '+(ly+4)+')"/>';
  const by=gy-stemH,pr=3+open*7,spread=2+open*6;
  for(let p=0;p<5;p++){const a=-Math.PI/2+p*(2*Math.PI/5),px=cx+Math.cos(a)*spread,py=by+Math.sin(a)*spread,deg=(a*180/Math.PI+90);
    s+='<ellipse cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" rx="'+(pr*0.7).toFixed(1)+'" ry="'+pr.toFixed(1)+'" fill="'+col+'" opacity="0.92" transform="rotate('+deg.toFixed(1)+' '+px.toFixed(1)+' '+py.toFixed(1)+')"/>';}
  s+='<circle cx="'+cx+'" cy="'+by+'" r="'+(2+open*3).toFixed(1)+'" fill="#fff3b0"/>';
  return svgWrap(w,h,s);
}
function flowerPositions(yearKey,count,W,H,m,minDist){
  const rnd=mulberry32(hashStr('bed'+yearKey));const pts=[];
  for(let i=0;i<count;i++){let best=null,bestD=-1;
    for(let t=0;t<80;t++){const x=m+rnd()*(W-2*m),y=m+rnd()*(H-2*m);let d=1e9;for(const p of pts){const dx=x-p.x,dy=y-p.y;d=Math.min(d,dx*dx+dy*dy);}
      if(d>=minDist*minDist){best={x:x,y:y};break;}if(d>bestD){bestD=d;best={x:x,y:y};}}
    pts.push(best);}
  return pts;
}

function getSubTasks(weekKey,dayIdx){

  if(!weeks[weekKey]['d'+dayIdx])weeks[weekKey]['d'+dayIdx]={};
  if(!weeks[weekKey]['d'+dayIdx].subTasks)weeks[weekKey]['d'+dayIdx].subTasks=[];

}
function toggleSubTask(weekKey,dayIdx,stId){

function addSubTask(inputEl){

  if(!lab.weeks[k].steps||!lab.weeks[k].steps.length)lab.weeks[k].steps=DEFAULT_STEPS.map(n=>({name:n,done:false,hours:0}));
  if(!lab.weeks[k].ops)lab.weeks[k].ops={};
  return lab.weeks[k];

function doneCount(wk){return wk.steps.filter(s=>s.done).length;}
function starPoints(cx,cy,r){
  let pts=[];for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;const a2=a+Math.PI/5;
    pts.push((cx+r*Math.cos(a))+','+(cy+r*Math.sin(a)));
    pts.push((cx+r*0.45*Math.cos(a2))+','+(cy+r*0.45*Math.sin(a2)));}
  return pts.join(' ');
}
function labBottleSVG(p){
  const w=120,h=184,top=22,neckW=24,bot=h-14;
  const waterY=bot-(bot-(top+40))*p;
  const clipId='bc'+(Math.random()*1e6|0);
  const pool=[[w/2-18,waterY+14,4,0],[w/2+14,waterY+26,3,1.1],[w/2+2,waterY+44,5,0.6],[w/2-10,waterY+58,3,1.6],[w/2+18,waterY+50,3.5,0.3]];
  let stars='';
  if(p>0.05){
    stars=pool.filter(s=>s[1]<bot-6).map(([cx,cy,r2,d])=>{
      if(cy>bot-8)return '';
      return `<polygon points="${starPoints(cx,cy,r2)}" fill="#ffe27a" stroke="#f4c430" stroke-width="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3.5; 0 0" dur="${(2.2+d).toFixed(1)}s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="${(2.2+d).toFixed(1)}s" repeatCount="indefinite"/></polygon>`;
    }).join('');
  }
  const bubbles=p>0.2?`<circle cx="${w/2-14}" cy="${bot-12}" r="2" fill="#fff" opacity=".6"><animate attributeName="cy" values="${bot-12};${waterY+8}" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="${w/2+12}" cy="${bot-20}" r="1.5" fill="#fff" opacity=".6"><animate attributeName="cy" values="${bot-20};${waterY+10}" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="3.6s" repeatCount="indefinite"/></circle>`:'';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs>
      <clipPath id="${clipId}"><path d="M${w/2-neckW/2} ${top} L${w/2-neckW/2} ${top+28} Q${w/2-neckW/2-6} ${top+44} ${w/2-34} ${top+58} L${w/2-34} ${bot-6} Q${w/2-34} ${bot} ${w/2-26} ${bot} L${w/2+26} ${bot} Q${w/2+34} ${bot} ${w/2+34} ${bot-6} L${w/2+34} ${top+58} Q${w/2+neckW/2+6} ${top+44} ${w/2+neckW/2} ${top+28} L${w/2+neckW/2} ${top} Z"/></clipPath>
      <linearGradient id="wg${clipId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfeeff"/><stop offset="1" stop-color="#5cc0f0"/></linearGradient>
    </defs>
    <rect x="${w/2-neckW/2-2}" y="${top-10}" width="${neckW+4}" height="12" rx="4" fill="#d9a86a"/>
    <rect x="${w/2-neckW/2-2}" y="${top-10}" width="${neckW+4}" height="4" rx="2" fill="#c2914f"/>
    <path d="M${w/2-neckW/2} ${top} L${w/2-neckW/2} ${top+28} Q${w/2-neckW/2-6} ${top+44} ${w/2-34} ${top+58} L${w/2-34} ${bot-6} Q${w/2-34} ${bot} ${w/2-26} ${bot} L${w/2+26} ${bot} Q${w/2+34} ${bot} ${w/2+34} ${bot-6} L${w/2+34} ${top+58} Q${w/2+neckW/2+6} ${top+44} ${w/2+neckW/2} ${top+28} L${w/2+neckW/2} ${top} Z" fill="#f4fbff" stroke="#bfe2f5" stroke-width="2.5"/>
    <g clip-path="url(#${clipId})">
      <rect x="${w/2-40}" y="${waterY}" width="80" height="${bot-waterY}" fill="url(#wg${clipId})"/>
      <path d="M${w/2-40} ${waterY} Q${w/2-20} ${waterY-5} ${w/2} ${waterY} T${w/2+40} ${waterY}" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>
      ${stars}${bubbles}
    </g>
    <path d="M${w/2-26} ${top+64} Q${w/2-30} ${top+90} ${w/2-26} ${bot-10}" stroke="#fff" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>
    ${p>=1?`<text x="${w/2}" y="${top+66}" font-size="15" text-anchor="middle">✨</text>`:''}
  </svg>`;
}

// 数据迁移：把改动前存进进阶魔药(wb_potions)的「🔥 热度选题：」历史残留，搬到实验田·选题收藏夹(wb_hot_favs)，并从进阶魔药清空。幂等：跑过一次后 potions 里就没有此类条目了。
function migrateHotFavs(){
  let moved=0; const remain=[];
  for(const p of potions){
    if(typeof p.title==='string' && p.title.indexOf('🔥 热度选题：')===0){
      const title=p.title.slice('🔥 热度选题：'.length);
      const out={reason:'',angle:'',example:'',source:''};
      const map={'理由':'reason','改编角度':'angle','示例':'example','来源':'source'};
      (p.content||'').split('\n').forEach(line=>{
        for(const k in map){
          const pre=k+'：';
          if(line.indexOf(pre)===0) out[map[k]]=line.slice(pre.length);
        }
      });
      hotFavs.push({
        id:p.id||uid(),
        title:title,
        reason:out.reason,
        angle:out.angle,
        example:out.example,
        source:out.source,
        cat:p.cat||'未分类',
        created:p.created||iso(new Date())
      });
      moved++;
    } else {
      remain.push(p);
    }
  }
  if(moved){
    potions=remain;
    store.set('wb_potions',potions);
    store.set('wb_hot_favs',hotFavs);
    if(typeof miniCheer==='function') miniCheer('🔄 已把 '+moved+' 条选题搬到收藏夹');
  }
  return moved;
}

function renderAnalysis(){
  const el=$('#labAnalysis');if(!el)return;
  const all=Object.values(lab.weeks);
  const finishedWeeks=all.filter(w=>w.steps&&w.steps.length&&w.steps.every(s=>s.done));
  const avgVideos=(finishedWeeks.length/(all.length||1)).toFixed(1);
  const cur=getLabWeek();const done=doneCount(cur);const total=cur.steps.length;
  const hoursArr=cur.steps.filter(s=>s.done&&s.hours).map(s=>s.hours);
  const spentH=hoursArr.reduce((a,b)=>a+b,0);
  let speedTxt, speedTip;
  if(finishedWeeks.length<2){
    speedTxt='数据还太少，先记录 2~3 周再判断～';
    speedTip='建议：每周坚持填「用时」和「运营数据」，积累几周后才看得出你的真实节奏和瓶颈。';
  }else{
    const avgH=finishedWeeks.reduce((a,w)=>a+w.steps.reduce((x,s)=>x+(s.hours||0),0),0)/finishedWeeks.length;
    if(spentH>0&&avgH>0&&spentH<avgH) {speedTxt='本周比历史平均更快 ⚡';speedTip=`你本周已花 ${spentH}h，历史周均 ${avgH.toFixed(1)}h——节奏在变快，说明流程熟了或工具顺手了，可以适当加量。`;}
    else {speedTxt='节奏稳定，有提速空间';speedTip=`本周已花 ${spentH}h vs 历史周均 ${avgH.toFixed(1)}h。提速关键通常在「生成图片/分镜」环节——多用模板和批量生成能省不少时间。`;}
  }
  const ops=cur.ops;const hasOps=Object.values(ops).some(v=>v>0);
  let opsTxt='把这周播放、涨粉等数据填上，从运营视角给你简单分析。';
  if(hasOps){
    const v=ops.views||0,f=ops.fans||0,p=ops.publishes||0;
    const fr= p>0 ? (v/p).toFixed(0) : '—';
    const tips=[];
    if(p>0&&v>0&&v/p<1000) tips.push('单条平均播放偏低，优先优化封面与开头 3 秒钩子，题材可对照日报板块①的热度排序。');
    if(f>0&&v===0) tips.push('涨粉但播放没填，可能自然流量在涨，留意哪些视频带来粉丝。');
    if(f>0&&v>0&&f/v>0.02) tips.push('粉丝转化率偏高（>2%），说明内容精准吸引目标用户，这个方向值得加码。');
    if(f===0&&v>0) tips.push('有播放但没涨粉，说明内容"看了就走"，缺人设钩子——可在视频里强化"洛克精灵"角色记忆点。');
    if(tips.length===0) tips.push('数据在健康区间，保持节奏、稳定更新最重要。');
    opsTxt=`<b>单条平均播放约 ${fr}</b>，新增粉丝 ${f}。运营视角：${tips.join(' ')}`;
  }
  el.innerHTML=`<div class="row"><h4>⏱️ 本周速度能加快吗</h4>
      <div class="kpi">${avgVideos}<span style="font-size:13px;color:#9c7c8e"> 个/周</span></div>
      <div class="sub">历史完成周平均产出（全 8 步做完算 1 个视频）</div>
      <p style="margin-top:8px"><b>${speedTxt}</b><br>${speedTip}</p></div>
    <div class="row"><h4>📺 视频 / 账号运营分析</h4><p>${opsTxt}</p></div>`;
}

function detectPlatform(url){
  try{
    const u=new URL(url.toLowerCase());
    const h=u.hostname.replace(/^www\./,'');
    if(h.includes('bilibili.com')||h.includes('b23.tv'))return 'B站';
    if(h.includes('zhihu.com'))return '知乎';
    if(h.includes('mp.weixin.qq.com')||h.includes('weixin.qq.com'))return '微信公众号';
    if(h.includes('xiaohongshu.com')||h.includes('xhslink.com'))return '小红书';
    if(h.includes('douyin.com')||h.includes('iesdouyin.com'))return '抖音';
    if(h.includes('weibo.com')||h.includes('weibo.cn'))return '微博';
    if(h.includes('qq.com'))return '腾讯';
    if(h.includes('juejin.cn'))return '掘金';
    if(h.includes('sspai.com'))return '少数派';
    if(h.includes('youtube.com')||h.includes('youtu.be'))return 'YouTube';
    if(h.includes('twitter.com')||h.includes('x.com'))return 'X/Twitter';
    return h.split('.')[0].toUpperCase();
  }catch(e){return '未知平台';}
}

function savePotionOverride(id,box,val){potionOverrides[id+':'+box]=val;store.set('wb_potion_overrides',potionOverrides);}

/* 一键复制指令（统一函数） */
function copyToClipboard(prompt,title,successHtml){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(prompt).then(()=>{
      showInfoModal(title||'已复制',
        successHtml||
        '<p>✅ <b>已复制到剪贴板！</b></p>'+
        '<p>请打开 WorkBuddy 对话框，<b>粘贴并发送</b>即可。</p>'+
        '<p class="modal-hint">受浏览器安全限制，网页无法直接打开手机 WorkBuddy APP 并自动填回内容。"一键复制 + 手动粘贴发送"是目前最可靠的方案，不是偷懒哦 😊</p>'+
        '<div style="background:#f5f5f5;border-radius:10px;padding:10px;font-size:11px;white-space:pre-wrap;max-height:200px;overflow:auto;margin-top:10px">'+escapeHtml(prompt)+'</div>');
    }).catch(()=>showCopyFallback(prompt,title));
  }else showCopyFallback(prompt,title);
}
function showCopyFallback(prompt,title){
  showInfoModal(title||'请手动复制',
    '<p>请复制下面的指令，粘贴到 WorkBuddy 对话框发送：</p>'+
    '<div style="background:#f5f5f5;border-radius:10px;padding:10px;font-size:11.5px;white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:10px">'+escapeHtml(prompt)+'</div>');
}

    '\n内容：'+(p.content||'(无)')+

    '\n\n要求：'+
    '\n- 相关资讯：搜索近期相关的 AI / 行业资讯 2~3 条，附原文链接，用大白话总结核心，并点出对「我」（AI漫剧 / 番茄推文 / 洛克精灵方向）的启发。'+

    '<p>✅ <b>已复制！</b></p><p>请打开 WorkBuddy 对话框，<b>粘贴并发送</b>即可。</p>'+

/* 进阶魔药 · AI 直连生成（复用收藏小屋的 BYOK callAI；服务商在 ⚙️设置 里切换 DeepSeek / Kimi K3，默认 DeepSeek） */
function potionAiPrompt(kind,p){
  const base='灵感标题：'+p.title+'\n灵感内容：'+(p.content||'(无)');
  if(kind==='search'){
    return {
      sys:'你是服务于做 AI 漫剧 / 番茄推文 / 洛克精灵方向创作的人的灵感顾问，擅长检索与总结相关资讯。',
      user: base+'\n\n请基于上述灵感，生成「相关资讯总结」：\n- 列出 2~3 条与该灵感相关的近期 AI / 行业资讯，尽量附可访问的原文链接；\n- 用大白话总结每条核心要点；\n- 点出对「我」（AI漫剧 / 番茄推文 / 洛克精灵方向）的启发或可用角度。\n（若你无法实时联网检索，请基于已有知识给出，并在开头标注「⚠️ 基于模型知识，非实时检索」。）'
    };
  }
  return {
    sys:'你是服务于做 AI 漫剧 / 番茄推文 / 洛克精灵方向创作的人的灵感顾问，擅长发散延伸方向。',
    user: base+'\n\n请基于上述灵感，生成「延伸可能性」：\n- 延伸 3~5 个可能的发展方向 / 玩法 / 落地路径；\n- 每条简明扼要，说明为什么可行、更适合哪个方向（AI漫剧 / 番茄推文 / 洛克精灵）。'
  };
}
async function aiGenPotion(btn,id,kind){
  const p=potions.find(x=>x.id===id); if(!p) return;
  if(!aiSettings.apiKey){ openAiSettings(); return; }
  const old=btn.textContent; btn.disabled=true; btn.textContent='🤖 生成中…';
  try{
    const pr=potionAiPrompt(kind,p);
    const out=(await callAI(pr.sys,pr.user)).trim();
    const ta=document.querySelector('textarea[data-pid="'+id+'"][data-boxid="'+kind+'"]');
    if(ta) ta.value=out;
    savePotionOverride(id,kind,out);
    renderPotion();
    if(typeof miniCheer==='function') miniCheer('🤖 已生成');
  }catch(err){
    if(err.message==='NO_KEY'){ openAiSettings(); }
    else showInfoModal('AI 生成失败','无法生成「'+(kind==='search'?'相关资讯总结':'延伸可能性')+'」：'+err.message+'\n\n可改用「📋 复制指令」交给我处理，或检查网络 / Key / 服务商是否选对。');
  }finally{ btn.disabled=false; btn.textContent=old; }
}
async function aiGenPotionAll(btn,id){
  const p=potions.find(x=>x.id===id); if(!p) return;
  if(!aiSettings.apiKey){ openAiSettings(); return; }
  const old=btn.textContent; btn.disabled=true; btn.textContent='🤖 生成中…';
  try{
    for(const k of ['search','extend']){
      const pr=potionAiPrompt(k,p);
      const out=(await callAI(pr.sys,pr.user)).trim();
      const ta=document.querySelector('textarea[data-pid="'+id+'"][data-boxid="'+k+'"]');
      if(ta) ta.value=out;
      savePotionOverride(id,k,out);
    }
    renderPotion();
    if(typeof miniCheer==='function') miniCheer('🤖 资讯+延伸已生成');
  }catch(err){
    if(err.message==='NO_KEY'){ openAiSettings(); }
    else showInfoModal('AI 生成失败','无法生成：'+err.message+'\n\n可改用「📋 复制指令」交给我处理，或检查网络 / Key / 服务商是否选对。');
  }finally{ btn.disabled=false; btn.textContent=old; }
}

/* ============ 特效 ============ */
const cvs=$('#fx'),ctx=cvs.getContext('2d');
function sizeCvs(){cvs.width=innerWidth;cvs.height=innerHeight;}sizeCvs();addEventListener('resize',sizeCvs);
let parts=[],fxRun=false;
function confetti(){
  const colors=['#ff8fc4','#ffd166','#9be3c9','#a9d5ff','#ff5fa2','#ffcf5c'];
  for(let i=0;i<90;i++)parts.push({x:innerWidth/2,y:innerHeight*0.32,vx:(Math.random()-.5)*11,vy:Math.random()*-9-3,g:.28,
    s:Math.random()*7+4,c:colors[i%colors.length],r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:90+Math.random()*40});
  if(!fxRun){fxRun=true;tick();}
}
function tick(){
  ctx.clearRect(0,0,cvs.width,cvs.height);parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.life--;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,p.life/40);ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore();}
  if(parts.length)requestAnimationFrame(tick);else{fxRun=false;ctx.clearRect(0,0,cvs.width,cvs.height);}
}

function ciMonday(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x;}
function ciWkKey(d){return ciMonday(d).toISOString().slice(0,10);}
function ciWkOfYear(d){const s=new Date(d.getFullYear(),0,1);return Math.floor((ciMonday(d)-ciMonday(s))/604800000)+1;}
function ciDayIdx(d){return (new Date(d).getDay()+6)%7;}
function ciTodayStr(){return new Date().toISOString().slice(0,10);}

function initCheckin(){
  const now=new Date();
  const wk=ciWkKey(now);
  const tIdx=ciDayIdx(now);
  const tStr=ciTodayStr();
  let st=store.get(CI_KEY,null);
  if(!st||st.week!==wk){
    st={week:wk,done:[false,false,false,false,false,false,false],hatched:false,spriteIdx:ciWkOfYear(now)%CI_SPRITES.length,lastCheck:null};
    store.set(CI_KEY,st);
  }
  const sprite=CI_SPRITES[st.spriteIdx];
  const q=s=>document.querySelector(s);
  const eggWrap=q('#ciEggWrap'),egg=q('#ciEgg'),spriteImg=q('#ciSprite'),sparkles=q('#ciSparkles');
  const fill=q('#ciFill'),doneN=q('#ciDone'),hint=q('#ciHint'),dots=q('#ciDots');
  const daysEl=q('#ciDays'),bigBtn=q('#ciBigBtn'),hatch=q('#ciHatch');
  const doneCount=()=>st.done.filter(Boolean).length;
  function render(){
    const n=doneCount();
    fill.style.width=(n/7*100)+'%';doneN.textContent=n;
    dots.innerHTML='';for(let i=0;i<7;i++){const d=document.createElement('i');if(st.done[i])d.className='ci-on';dots.appendChild(d);}
    q('#ciWeek').textContent='第 '+ciWkOfYear(now)+' 周';
    eggWrap.style.width=(104+n*7)+'px';eggWrap.style.height=(128+n*8.5)+'px';
    if(n>=6)eggWrap.classList.add('ci-cracked');else eggWrap.classList.remove('ci-cracked');
    if(st.done[tIdx]){hint.textContent='今天已打卡 ✓ 明天再来～';hint.classList.add('ci-done');}
    else{hint.textContent=n===0?'今天还没打卡哦～':'还差 '+(7-n)+' 天就孵化啦！';hint.classList.remove('ci-done');}
    bigBtn.disabled=st.done[tIdx];bigBtn.textContent=st.done[tIdx]?'今日已打卡 ✓':'今日打卡 ✦';
    daysEl.innerHTML='';
    st.done.forEach((ok,i)=>{
      const future=i>tIdx,isToday=i===tIdx;
      const card=document.createElement('div');
      card.className='ci-day'+(isToday?' ci-today':'')+(ok?' ci-done':'')+(future?' ci-future':'')+(i===6?' ci-sun':'');
      const status=ok?'已打卡':future?'未开启':isToday?'今天':'待补卡';
      card.innerHTML='<div class="ci-dot">'+(ok?'✓':'')+'</div>'+
        '<div class="ci-info"><div class="ci-name">'+CI_DAYS[i]+(isToday?'<span class="ci-jin">今</span>':'')+'</div>'+
        '<div class="ci-status">'+status+'</div></div>'+
        '<button class="ci-dbtn">'+(ok?'已打卡':'打卡')+'</button>';
      if(!ok&&!future)card.addEventListener('click',()=>checkIn(i));
      daysEl.appendChild(card);
    });
    if(st.hatched){
      eggWrap.classList.add('ci-hatched');
      spriteImg.src=sprite.file;spriteImg.hidden=false;spriteImg.style.opacity=1;spriteImg.style.transform='translateX(-50%) scale(1)';
      showHatch();
    }else{hatch.hidden=true;}
  }
  function showHatch(){
    q('#ciHatchSprite').src=sprite.file;q('#ciHatchName').textContent=sprite.name;q('#ciHatchDesc').textContent=sprite.desc;hatch.hidden=false;
  }
  function checkIn(i){
    if(st.done[i])return;
    st.done[i]=true;if(i===tIdx)st.lastCheck=tStr;store.set(CI_KEY,st);
    eggWrap.classList.remove('ci-wiggle');void eggWrap.offsetWidth;eggWrap.classList.add('ci-wiggle');
    setTimeout(()=>eggWrap.classList.remove('ci-wiggle'),720);
    render();
    if(doneCount()===7)setTimeout(hatchEgg,520);
  }
  function hatchEgg(){
    st.hatched=true;store.set(CI_KEY,st);
    eggWrap.classList.add('ci-cracking');
    setTimeout(()=>{
      eggWrap.classList.add('ci-hatched');
      spriteImg.src=sprite.file;spriteImg.hidden=false;spriteImg.classList.add('ci-pop');
      sparkles.classList.add('ci-go');setTimeout(()=>sparkles.classList.remove('ci-go'),950);
      showHatch();
      if(window.confetti)confetti();
      if(window.miniCheer)miniCheer('🥚 本周精灵 '+sprite.name+' 孵化啦！');
    },820);
  }
  bigBtn.addEventListener('click',()=>{
    if(st.done[tIdx]){if(window.miniCheer)miniCheer('今天已经打卡啦，明天再来～');return;}
    checkIn(tIdx);
  });
  const resetEl=q('#ciReset');
  if(resetEl)resetEl.addEventListener('click',()=>{
    st={week:wk,done:[false,false,false,false,false,false,false],hatched:false,spriteIdx:ciWkOfYear(now)%CI_SPRITES.length,lastCheck:null};
    store.set(CI_KEY,st);
    eggWrap.classList.remove('ci-hatched','ci-cracked','ci-cracking','ci-wiggle');
    spriteImg.hidden=true;spriteImg.classList.remove('ci-pop');spriteImg.style.opacity=0;
    render();
  });
  render();
}
